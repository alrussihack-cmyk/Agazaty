name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on GitHub runner
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT/platforms/android-35" ]; then
            echo "Android 35 platform is missing from runner SDK: $SDK_ROOT"
            ls -la "$SDK_ROOT/platforms" || true
            exit 1
          fi
          echo "sdk.dir=$SDK_ROOT" > local.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agazaty-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK as a downloadable release
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Agazaty.apk
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release delete debug-latest --cleanup-tag --yes
          fi
          gh release create debug-latest Agazaty.apk --prerelease --target "$TARGET" \
            --title "Agazaty debug build" --notes "Latest debug APK built by CI (commit $TARGET). Download Agazaty.apk and install it."
